<style>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const st=$('#st'),cam=$('#cam'),U=$('#ufo'),oy=$('#oy'),hd=$('#hd'),W=$('#words'),cap=$('#cap'),btn=$('#btn'),bub=$('#bub'),bm=$('#beam'),fd=$('#fd'),pL=$('#pL'),pR=$('#pR'),pw=$('#pw'),gr=$('#gr');
/* Rakaman suara sendiri (pilihan): isi mis. {bas:'audio/bas.mp3',kera:'audio/kera.mp3'} */
const VOICE={};
window.onunhandledrejection=e=>e.preventDefault();
let tok=0,paused=false,mute=false,camS=1,AC,M,live=0;
/* ---------- masa & animasi ---------- */
const sleep=ms=>new Promise((ok,no)=>{const m=tok;let t=0,l=performance.now();const f=n=>{if(m!==tok)return no('x');if(!paused)t+=n-l;l=n;t>=ms?ok():requestAnimationFrame(f)};requestAnimationFrame(f)});
function tw(e,p,ms=600,ez='ease-in-out',fr={}){const c=getComputedStyle(e),a={},b={};for(const k in p){a[k]=fr[k]??c[k];b[k]=p[k]}e.animate([a,b],{duration:ms,easing:ez});Object.assign(e.style,p)}
const go=(e,k,o)=>e.animate(k,o),op=(e,v,ms=500)=>tw(e,{opacity:v},ms);
const zm=(s,x=50,y=50,ms=900)=>{if(camS===1)cam.style.transformOrigin=x+'% '+y+'%';camS=s;tw(cam,{transform:`scale(${s})`},ms);return sleep(ms)};
const T=(r,s=1)=>`translate(-50%,-50%) rotate(${r}deg) scale(${s})`;
const hl=s=>s.replace(/\[(.+?)\]/g,'<span class="hl">$1</span>');
function pos(e){const s=st.getBoundingClientRect(),r=e.getBoundingClientRect();return{x:(r.left+r.width/2-s.left)/s.width*100,y:(r.top+r.height/2-s.top)/s.height*100}}
const ux=()=>parseFloat(U.style.left),uy=()=>parseFloat(U.style.top)+U.offsetHeight/st.clientHeight*62;
const fly=(x,y,ms,s=1)=>{tw(U,{left:x+'%',top:y+'%',scale:s},ms);bub.className=x>52?'L':'R'};
const closeup=()=>zm(1.6,ux(),parseFloat(U.style.top)+12,1000);
/* ---------- bunyi ---------- */
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();M=AC.createGain();M.connect(AC.destination)}AC.resume()}
function tn(f,d,o={}){if(!AC)return;const{t='sine',v=.12,to=f,dl=0}=o,x=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+dl;x.type=t;x.frequency.setValueAtTime(f,n);x.frequency.exponentialRampToValueAtTime(Math.max(to,20),n+d);g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.02);g.gain.exponentialRampToValueAtTime(.001,n+d);x.connect(g);g.connect(M);x.start(n);x.stop(n+d+.05)}
function ns(d,f0,f1,v=.2){if(!AC)return;const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime;s.buffer=b;f.type='bandpass';f.Q.value=4;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v,t);g.gain.linearRampToValueAtTime(0,t+d);s.connect(f);f.connect(g);g.connect(M);s.start()}
let lm=0;const sfx={fly:()=>{tn(80,2.2,{v:.08,to:150});tn(160,2.2,{t:'triangle',v:.03,to:260})},laser:()=>{tn(1300,.5,{t:'sawtooth',v:.06,to:300});tn(180,1,{t:'square',v:.03})},suck:()=>ns(1.4,300,2600,.22),meow:()=>{if(!AC||performance.now()-lm<800)return;lm=performance.now();const t=AC.currentTime,o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(420,t);o.frequency.linearRampToValueAtTime(820,t+.18);o.frequency.linearRampToValueAtTime(480,t+.65);f.type='bandpass';f.Q.value=3;f.frequency.setValueAtTime(900,t);f.frequency.linearRampToValueAtTime(1800,t+.25);f.frequency.linearRampToValueAtTime(900,t+.65);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.06);g.gain.linearRampToValueAtTime(.18,t+.4);g.gain.linearRampToValueAtTime(0,t+.7);o.connect(f);f.connect(g);g.connect(M);o.start(t);o.stop(t+.75)},purr:()=>{if(!AC)return;const d=1.8,n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain(),t=AC.currentTime;s.buffer=b;f.type='bandpass';f.frequency.value=180;f.Q.value=1.5;g.gain.setValueAtTime(.14,t);g.gain.linearRampToValueAtTime(0,t+d);l.frequency.value=24;lg.gain.value=.12;l.connect(lg);lg.connect(g.gain);s.connect(f);f.connect(g);g.connect(M);s.start();l.start();l.stop(t+d)},ping:()=>{tn(900,.2,{v:.1,to:1500})},happy:()=>{lm=0;sfx.meow();setTimeout(()=>sfx.purr(),500);[0,.22,.44].forEach((d,i)=>tn(700+i*120,.2,{t:'triangle',v:.09,to:1100+i*150,dl:d}))},grr:()=>{tn(75,1.3,{t:'sawtooth',v:.1,to:55});tn(150,1.3,{t:'square',v:.03,to:110});ns(1.3,250,120,.25)},pop:()=>tn(500,.12,{v:.08,to:900}),click:()=>tn(700,.08,{t:'square',v:.06,to:400}),fail:()=>{tn(420,.9,{t:'sawtooth',v:.08,to:50});ns(.9,900,100,.2)}};
function loops(){if(live)return;live=1;setInterval(()=>{if(!AC||paused||mute)return;for(let i=0;i<3;i++)tn(4300,.05,{t:'square',v:.01,dl:i*.09})},1400);const sc=[220,262,294,330,392,440];let k=0;setInterval(()=>{if(!AC||paused||mute)return;k=(k+[1,2,-1,3][Math.random()*4|0]+6)%6;tn(sc[k],.6,{t:'triangle',v:.025});if(k%2)tn(sc[k]/2,.9,{t:'sine',v:.02})},560)}
function say(k){if(mute)return;if(VOICE[k]){new Audio(VOICE[k]).play();return}const ss=window.speechSynthesis;if(!ss)return;const v=ss.getVoices().find(x=>/^ms/i.test(x.lang));if(!v)return;const u=new SpeechSynthesisUtterance(k);u.voice=v;u.lang='ms-MY';u.rate=.75;ss.cancel();ss.speak(u)}
/* ---------- Si Oyen ---------- */
const SM='M150 102v3M150 105q-7 7-13 1M150 105q7 7 13 1';
const E={n:[1,0,1,SM,0,0,0],sly:[1,1,1,'M150 102v3M150 105q-7 6-13 0M150 105q9 8 17-3',0,0,0],happy:[.4,0,1,SM,1,0,0],shock:[1.15,0,.55,SM,1,0,0],sad:[1,0,1,'M150 105q-7-7-13 0M150 105q7-7 13 0',0,22,0],puz:[1,0,1,'M150 106q-6-3-12 0q6 3 12 0',0,22,10],up:[1.05,0,1,SM,0,-6,0]};
function face(k){const[a,l,p,m,o,ea,t]=E[k];$('#eyes').style.transform=`scaleY(${a})`;$('#lid').style.opacity=l;$$('.pu').forEach(x=>x.style.transform=`scale(${p})`);$('#mo').setAttribute('d',m);$('#mO').style.opacity=o;$('#eL').style.transform=`rotate(${-ea}deg)`;$('#eR').style.transform=`rotate(${ea}deg)`;hd.style.transform=`rotate(${t}deg)`}

const wag=s=>$('#tl').style.animationDuration=s+'s';
const paw=()=>go(pR,[{transform:'translate(0,0)'},{transform:'translate(-12px,-14px)'}],{duration:500,fill:'forwards'});
